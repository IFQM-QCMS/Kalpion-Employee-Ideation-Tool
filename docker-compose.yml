services:

  # MariaDB 10.11, matching the version CI runs the suite against.
  #
  # Credentials come from the environment, not from this file: it is committed
  # to a public repository, so a literal password here is a published password.
  # Put them in a .env file beside this one (docker compose reads it
  # automatically) and keep that file out of git.
  kalpion-db:
    image: mariadb:10.11
    container_name: kalpion-db
    restart: unless-stopped
    environment:
      # These are read ONLY when the data volume is empty - MariaDB ignores them
      # once it has initialised. So an existing deployment keeps working with
      # the password already inside its volume even if these are unset here, and
      # a fresh install that leaves them blank is refused by the image itself
      # rather than coming up unprotected. Deliberately not `:?`, which would
      # fail a deploy on a running system that does not need them.
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ifqm_master
      MARIADB_USER: ifqm_app
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - kalpion-db-data:/var/lib/mysql
      # Kalpion is multi-tenant and creates a database per organisation at
      # runtime. MARIADB_USER alone is granted rights on MARIADB_DATABASE only,
      # so without this the first new organisation fails with "access denied"
      # when the app tries to CREATE DATABASE. Runs once, on an empty volume.
      - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    networks:
      - kalpion-internal

  kalpion-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kalpion-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./db:/db:ro
    depends_on:
      - kalpion-db
    networks:
      - kalpion-internal
      - ifqm-new-sites

  kalpion-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: https://kalpion.ifqm.org.in/api
    container_name: kalpion-web
    restart: unless-stopped
    depends_on:
      - kalpion-api
    networks:
      - kalpion-internal
      - ifqm-new-sites

networks:
  kalpion-internal:
    driver: bridge

  ifqm-new-sites:
    external: true

volumes:
  kalpion-db-data:
