name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout tested code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Baseline, taken before we touch anything, so the check after the deploy
      # has something to compare against. These sites share the VPS and its
      # reverse proxy with Kalpion but are owned by other teams - this deploy
      # must never be the reason one of them goes down.
      - name: Record sibling sites' health before deploying
        run: |
          for site in skills.ifqm.org.in dwm.ifqm.org.in octaqube.ifqm.org.in; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$site/" || echo 000)
            echo "$site -> $code"
            echo "BEFORE_$(echo "$site" | tr '.-' '__')=$code" >> "$GITHUB_ENV"
          done

      - name: Create deployment package
        run: |
          tar \
            --exclude='.git' \
            --exclude='backend/.env' \
            --exclude='backend/uploads' \
            --exclude='backend/backups' \
            --exclude='node_modules' \
            -czf /tmp/kalpion-deploy.tar.gz .
            mv /tmp/kalpion-deploy.tar.gz .

      - name: Copy deployment package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_VPS_IP }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          source: "kalpion-deploy.tar.gz"
          target: "/tmp"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOSTINGER_VPS_IP }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /opt/ifqm-kalpion

            echo "Backing up production environment..."
            cp backend/.env /tmp/kalpion-backend.env

            echo "Updating application files..."
            tar -xzf /tmp/kalpion-deploy.tar.gz -C /opt/ifqm-kalpion

            echo "Restoring production environment..."
            cp /tmp/kalpion-backend.env backend/.env
            rm -f /tmp/kalpion-backend.env

            echo "Building production containers..."
            docker compose build --pull kalpion-api kalpion-web

            echo "Starting application containers..."
            docker compose up -d --no-deps kalpion-api kalpion-web

            echo "Checking containers..."
            docker ps --filter "name=kalpion-api" --filter "name=kalpion-web"

            # The database container is deliberately not rebuilt or restarted by
            # a deploy, but it does have to be running before migrations.
            echo "Ensuring the database is up..."
            docker compose up -d kalpion-db

            echo "Waiting for MariaDB to accept connections..."
            for i in $(seq 1 30); do
              if docker exec kalpion-db mariadb-admin ping -h 127.0.0.1 --silent >/dev/null 2>&1 \
                 || docker exec kalpion-db mysqladmin ping -h 127.0.0.1 --silent >/dev/null 2>&1; then
                echo "Database ready."
                break
              fi
              sleep 2
            done

            # Migrations are forward-only and tracked in a ledger
            # (ifqm_master.schema_migrations), so only unapplied files run and
            # re-running is safe. Without this step the code ships ahead of the
            # schema and the mismatch only surfaces when a feature misbehaves.
            echo "Running database migrations..."
            docker exec kalpion-api npm run migrate

            echo "Checking backend..."
            for i in {1..10}; do
              # /api/health, not /: the root path 404s, and a 404 counted as
              # healthy would pass even with every route broken.
              #
              # x-forwarded-proto is required. FORCE_HTTPS is on in production,
              # so a plaintext request is answered with a 308 to the public URL
              # and never reaches the route at all. The header is what the proxy
              # sends, and app.js honours it, so this asks the same question a
              # real request does and can read the actual answer.
              if docker exec kalpion-api node -e "require('http').get({host:'127.0.0.1',port:4000,path:'/api/health',headers:{'x-forwarded-proto':'https'}},r=>{let b='';r.on('data',c=>b+=c);r.on('end',()=>process.exit(r.statusCode===200&&b.includes('\"status\":\"ok\"')?0:1))}).on('error',()=>process.exit(1))"; then
                echo "Backend is healthy."
                healthy=1
                break
              fi
              echo "Backend not ready yet. Waiting..."
              sleep 3
            done

            # Without this the loop just ends and the deploy reports success
            # even when the backend never came up.
            if [ "${healthy:-0}" != "1" ]; then
              echo "Backend never became healthy. Recent log:"
              docker logs --tail 40 kalpion-api || true
              exit 1
            fi

            # kalpion-api and kalpion-web both have a fixed address on
            # ifqm-new-sites (docker-compose.yml), so recreating them never
            # changes the address the shared proxy sends traffic to - nothing
            # on that proxy needs to re-resolve anything because of this
            # deploy. That proxy, and every other site behind it, belongs to
            # IFQM's server administrator (DEPLOYMENT_SETTINGS.md), not to
            # this repository: a Kalpion deploy must not reach into it, reload
            # it, or touch any container that is not one of the three listed
            # above.
            echo "Checking website..."
            for i in {1..10}; do
              code=$(curl -s -o /dev/null -w '%{http_code}' https://kalpion.ifqm.org.in/api/health || echo 000)
              if [ "$code" = "200" ]; then
                echo "Website answers 200."
                site_ok=1
                break
              fi
              echo "Website answered $code. Waiting..."
              sleep 5
            done
            if [ "${site_ok:-0}" != "1" ]; then
              echo "The application is up inside its containers, but the public URL does not reach it."
              echo "That is the reverse proxy: check that it resolves kalpion-api / kalpion-web at their current addresses (above)."
              exit 1
            fi

            # /api/health is served by kalpion-api, not kalpion-web, so the check above never
            # actually exercises the web container's own nginx (frontend/nginx.conf) - a mistake
            # there (bad syntax, a broken location block) could leave kalpion-web crash-looping
            # or serving something wrong while /api/health still answers fine through the proxy.
            # Checking the real homepage, and that it looks like the app rather than an nginx
            # error page or something empty, closes that gap.
            echo "Checking the web container itself (not just the API)..."
            for i in {1..10}; do
              home=$(curl -s https://kalpion.ifqm.org.in/ || echo "")
              home_code=$(curl -s -o /dev/null -w '%{http_code}' https://kalpion.ifqm.org.in/ || echo 000)
              if [ "$home_code" = "200" ] && echo "$home" | grep -q '<div id="root">'; then
                echo "Homepage answers 200 and looks like the app."
                home_ok=1
                break
              fi
              echo "Homepage answered $home_code and did not look right yet. Waiting..."
              sleep 5
            done
            if [ "${home_ok:-0}" != "1" ]; then
              echo "The API is healthy but the website itself is not answering correctly."
              echo "Check kalpion-web specifically: docker logs kalpion-web, and frontend/nginx.conf for a mistake in the change just deployed."
              exit 1
            fi

            echo "Kalpion deployment successful."

            rm -f /tmp/kalpion-deploy.tar.gz

      # This deploy no longer touches anything outside the three Kalpion
      # containers (see the comment in the step above), but the shared VPS
      # and proxy are still shared, so this is a smoke detector, not a
      # guarantee: if a sibling site that was healthy before this run is not
      # healthy now, something about this deploy or its timing affected
      # shared infrastructure, and that must be investigated immediately
      # rather than discovered later from a user report.
      - name: Verify sibling sites were not affected by this deploy
        if: always()
        run: |
          failed=0
          for site in skills.ifqm.org.in dwm.ifqm.org.in octaqube.ifqm.org.in; do
            key="BEFORE_$(echo "$site" | tr '.-' '__')"
            before="${!key}"
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "https://$site/" || echo 000)
            echo "$site -> before=$before now=$code"
            if [ "$before" = "200" ] && [ "$code" != "200" ]; then
              echo "::error::$site was healthy before this deploy and is not now ($code). This deploy may have affected shared infrastructure - investigate immediately."
              failed=1
            fi
          done
          if [ "$failed" = "1" ]; then
            exit 1
          fi
