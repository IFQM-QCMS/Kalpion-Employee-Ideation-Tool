<!doctype html>
<html lang="en">
  <head>
    <script>
      (function(){var t=localStorage.getItem('ifqm-theme');if(t)document.documentElement.setAttribute('data-theme',t)})();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>IFQM Employee Ideation Tool — turn shop-floor ideas into measured improvements</title>
    <meta name="description" content="Employee ideation software for Indian MSMEs. Collect ideas from the shop floor, route them through your own approval chain, and track what each one saved. Seven Indian languages, 14-day free trial." />
    <meta name="theme-color" content="#4f46e5" />
    <!-- Every organisation's data sits behind a sign-in, so there is nothing
         here for a crawler to index beyond the public pages. Follow is left on
         so the landing page's own links are understood. -->
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://eit-sage.vercel.app/" />

    <!-- Shared previews: a pasted link in WhatsApp or LinkedIn is how most of
         this product gets introduced to a customer. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IFQM Employee Ideation Tool" />
    <meta property="og:title" content="Turn shop-floor ideas into measured improvements" />
    <meta property="og:description" content="Employee ideation software for Indian MSMEs. Collect ideas, route them through your own approval chain, and track what each one saved. 14-day free trial." />
    <meta property="og:url" content="https://eit-sage.vercel.app/" />
    <meta property="og:image" content="https://eit-sage.vercel.app/assets/favicon.png" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IFQM Employee Ideation Tool" />
    <meta name="twitter:description" content="Collect ideas from the shop floor, route them for approval, and track what each one saved." />

    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!--
      Structured data.

      Three things a search engine can use: who IFQM is and where, what the
      product is and what it costs, and the questions the landing page already
      answers. It is written here rather than injected by React so a crawler
      that does not run JavaScript still sees it.

      Everything below is stated on the page itself. Structured data that claims
      more than the page says is the fastest way to lose the rich result.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://eit-sage.vercel.app/#organisation",
          "name": "IFQM",
          "alternateName": "Indian Foundation for Quality Management",
          "url": "https://eit-sage.vercel.app/",
          "logo": "https://eit-sage.vercel.app/assets/favicon.png",
          "description": "IFQM builds quality and improvement software for Indian micro, small and medium enterprises.",
          "areaServed": { "@type": "Country", "name": "India" },
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Bengaluru",
            "addressRegion": "Karnataka",
            "addressCountry": "IN"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "availableLanguage": ["English", "Hindi", "Kannada", "Tamil", "Telugu", "Marathi", "Malayalam"],
            "hoursAvailable": {
              "@type": "OpeningHoursSpecification",
              "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
              "opens": "09:00",
              "closes": "18:00"
            }
          }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://eit-sage.vercel.app/#product",
          "name": "IFQM Employee Ideation Tool",
          "applicationCategory": "BusinessApplication",
          "applicationSubCategory": "Continuous improvement and suggestion management",
          "operatingSystem": "Any modern web browser",
          "url": "https://eit-sage.vercel.app/",
          "publisher": { "@id": "https://eit-sage.vercel.app/#organisation" },
          "description": "Collect improvement ideas from every employee, route them through your own approval chain, and record what each one actually saved.",
          "inLanguage": ["en", "hi", "kn", "ta", "te", "mr", "ml"],
          "featureList": [
            "Idea submission from a phone in seven Indian languages",
            "Approval chain matching your own reporting structure",
            "Automatic scoring and duplicate detection",
            "Leaderboards, points and time-boxed challenges",
            "Exports to Excel and PDF",
            "Push approved ideas into a quality management system"
          ],
          "offers": {
            "@type": "Offer",
            "priceCurrency": "INR",
            "price": "0",
            "description": "14-day free trial of the complete product, no card required. Paid plans are quoted per organisation on approval.",
            "availability": "https://schema.org/InStock"
          }
        },
        {
          "@type": "FAQPage",
          "@id": "https://eit-sage.vercel.app/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "How long does setup take?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "A working day is typical. You create your organisation, import your staff list from a spreadsheet, pick your categories and approval rule, and you are live. There is no server to buy and nothing to install on anyone's machine."
              }
            },
            {
              "@type": "Question",
              "name": "What does it cost?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Every organisation starts with a 14-day free trial of the whole product, with no card required. After that you go onto a plan sized to your business, quoted when we approve your application. Plans are priced per organisation rather than per seat, and GST is shown separately on every quote."
              }
            },
            {
              "@type": "Question",
              "name": "What happens when the free trial ends?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "We tell you before it does. Access pauses if a plan is not in place, but nothing is deleted: your ideas, your people and your history stay as they are and everything resumes once payment is arranged. You can export your data at any point, including while access is paused."
              }
            },
            {
              "@type": "Question",
              "name": "How quickly does IFQM reply to support?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Within one working day for any support ticket, and within four working hours for anything marked urgent. Support runs Monday to Saturday, 9am to 6pm IST, and stays reachable even if an organisation's access has paused for payment."
              }
            },
            {
              "@type": "Question",
              "name": "Who can see our ideas?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Only your own people, according to the role you give them. Each organisation runs on its own separate database. IFQM's own staff can see counts for support and billing, never the content of an idea."
              }
            },
            {
              "@type": "Question",
              "name": "Do we need an IT person to run it?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Everything an administrator needs — users, categories, approval stages, branding and exports — is a screen in the app, and bulk user import takes a spreadsheet."
              }
            },
            {
              "@type": "Question",
              "name": "Can we get our data out?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Ideas, reviews and analytics export to Excel and PDF, and an integration lets approved ideas be pushed into a quality or CAPA system you already run."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
