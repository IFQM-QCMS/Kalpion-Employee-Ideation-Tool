# KAL-031 / KAL-033: this container used to send no browser security headers at all and no
# compression or cache policy - every request re-downloaded the full ~2MB bundle uncompressed,
# and the app could be framed by another site (clickjacking) with nothing to stop it.
#
# The shared reverse proxy in front of this container terminates TLS (see
# DEPLOYMENT_SETTINGS.md) and this container only ever receives plain HTTP from it, but the
# headers below describe the connection the BROWSER actually has, which is always HTTPS in
# production - so they are sent unconditionally, with no $scheme check.

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_proxied any;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml application/ld+json
    image/svg+xml;
# text/html is always gzipped by nginx regardless of this list, and no font files are served
# from here at all (fonts load from fonts.gstatic.com), so neither needs listing above.
# Brotli would compress further still, but the stock nginx:alpine image this is built on has no
# brotli module compiled in - that needs a different base image, left for a follow-up rather than
# swapping images blind in the same change as the headers below.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers, every response. "always" is required for them to also reach 4xx/5xx
    # error responses, which add_header otherwise skips.
    #
    # CSP ships report-only first, exactly as the finding asked: this app leans heavily on
    # inline `style=""` (style-src needs 'unsafe-inline' for that, not just a style tag) and has
    # two small inline <script> blocks in index.html (the pre-paint theme script and the JSON-LD
    # block), so script-src keeps 'unsafe-inline' too rather than breaking both on day one.
    # Report-only logs violations to the browser console without blocking anything; tightening
    # further (nonces instead of 'unsafe-inline', then switching to the enforcing header) is a
    # follow-up once real traffic has been checked against this policy.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # The SPA shell: never cached, so a deploy's new asset hashes are picked up on next load
    # instead of a visitor being stuck on yesterday's index.html pointing at files that are gone.
    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Cache-Control "no-cache" always;
    }

    # Vite's own build output is content-hashed (index-<hash>.js/css) - safe to cache for a long
    # time because a changed file is a changed URL. Scoped to .js/.css specifically, NOT the
    # whole /assets/ folder: that folder also holds the organisation logo and favicon files
    # (copied verbatim from frontend/public/assets, never hashed), which DO get overwritten in
    # place at the same URL when a branding asset changes - a long cache on those would mean a
    # new logo not showing up in anyone's browser for up to a year.
    location ~* \.(?:js|css)$ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else under /assets (logos, favicon, any other unhashed file served verbatim
    # from the public folder): no-cache rather than a long max-age, so a browser always asks
    # "has this changed?" (a cheap 304 when it hasn't) instead of possibly sitting on a stale
    # logo for however long a heuristic cache decides to keep it - the exact confusion a missing
    # Cache-Control header caused here before.
    location /assets/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Every client-side route (/dashboard, /login, /admin, ...) is served through here, falling
    # back to index.html's content via try_files - the exact-match block above only ever fires
    # for a literal request to "/index.html", which nothing in this app actually requests. So
    # this location, not that one, is what needs the same no-cache treatment in practice.
    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
